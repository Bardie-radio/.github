name: Version check scripts

on:
  push:
    paths:
      - scripts/version-check/**
  pull_request:
    paths:
      - scripts/version-check/**

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: node --test scripts/version-check/check.test.mjs
